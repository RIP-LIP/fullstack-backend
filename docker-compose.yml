services:
  db:
    image: postgres:17-alpine
    container_name: fullstack-backend-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: orders
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d orders']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
